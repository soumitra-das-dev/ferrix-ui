name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: ferrix-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: ferrix-aarch64-unknown-linux-gnu
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            binary_name: ferrix-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: ferrix-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: ferrix-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p ferrix-cli
          else
            cargo build --release --target ${{ matrix.target }} -p ferrix-cli
          fi
        shell: bash

      - name: Stage Artifact
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/ferrix.exe ${{ matrix.binary_name }}
          else
            cp target/${{ matrix.target }}/release/ferrix ${{ matrix.binary_name }}
            chmod +x ${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish create-ferrix-app to npm
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish npm package
        run: |
          cd packages/create-ferrix-app
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
