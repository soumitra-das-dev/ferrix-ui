name: Ferrix CI

on:
  push:
    branches: [ master, main, 'verify/**' ]
  pull_request:
    branches: [ master, main, 'verify/**' ]
  workflow_dispatch:

jobs:
  rust-verification:
    name: Rust Workspace Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Clippy Warnings Check
        run: cargo clippy --workspace -- -D warnings

      - name: Run All Workspace Tests
        run: cargo test --workspace

  android-verification:
    name: Android Runtime & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Host JNI Library for Robolectric Tests
        run: cargo build -p ferrix-android

      - name: Run Gradle Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

  publish-crates:
    name: Auto-Publish to Crates.io
    needs: [rust-verification, android-verification]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Secret Presence
        id: check-secret
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CARGO_REGISTRY_TOKEN nor CRATES_IO_TOKEN secret found in repository settings. Set your crates.io token in GitHub Repo Settings > Secrets and variables > Actions to enable automatic publishing."
          fi

      - name: Publish Workspace Crates to Crates.io
        if: steps.check-secret.outputs.has_token == 'true'
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
          check-repo: false
          ignore-unpublished-changes: true
          publish-delay: 30000

