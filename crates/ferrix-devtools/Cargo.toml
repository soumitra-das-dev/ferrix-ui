[package]
name = "ferrix-devtools"
version = "0.1.0"
edition = "2021"
description = "In-app developer tools, FPS monitor, patch inspector, signal graph debugger, and background job manager for Ferrix"
license = "MIT OR Apache-2.0"

[dependencies]
ferrix-core = { path = "../ferrix-core" }
ferrix-renderer-protocol = { path = "../ferrix-renderer-protocol" }
ferrix-reactivity = { path = "../ferrix-reactivity" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
