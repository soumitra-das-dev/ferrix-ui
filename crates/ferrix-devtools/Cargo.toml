[package]
name = "ferrix-devtools"
version.workspace = true
edition = "2021"
description = "In-app developer tools, FPS monitor, patch inspector, signal graph debugger, and background job manager for Ferrix"
license = "MIT OR Apache-2.0"
repository.workspace = true

[dependencies]
ferrix-ui-core = { version = "0.1.1", path = "../ferrix-ui-core" }
ferrix-renderer-protocol = { version = "0.1.1", path = "../ferrix-renderer-protocol" }
ferrix-reactivity = { version = "0.1.1", path = "../ferrix-reactivity" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
