[workspace]
resolver = "2"
members = [
    "crates/ferrix-renderer-protocol",
    "crates/ferrix-reactivity",
    "crates/ferrix-layout",
    "crates/ferrix-core",
    "crates/ferrix-compiler",
    "crates/ferrix-network",
    "crates/ferrix-modules",
    "crates/ferrix-android",
    "crates/ferrix-cli",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ferrix-ui/ferrix"
authors = ["Ferrix Developers"]

[workspace.dependencies]
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
bytes = "1.9"
taffy = "0.7"
jni = { version = "0.21", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
